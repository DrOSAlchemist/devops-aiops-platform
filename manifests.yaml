apiVersion: apps/v1
kind: Deployment
metadata: {name: aiops-triage}
spec:
  replicas: 2
  selector: {matchLabels: {app: aiops-triage}}
  template:
    metadata: {labels: {app: aiops-triage}}
    spec:
      containers:
      - name: api
        image: ghcr.io/your-org/aiops-triage:latest
        ports: [{containerPort: 8080}]
        readinessProbe: {httpGet: {path: /metrics, port: 8080}}
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata: {name: aiops-alerts}
spec:
  groups:
  - name: aiops
    rules:
    - alert: AIOpsServiceDown
      expr: aiops_service_up == 0
      for: 2m
      labels: {severity: critical}
